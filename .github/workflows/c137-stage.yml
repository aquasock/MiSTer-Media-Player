name: c137-stage
on:
  push:
    branches: [c137-staging]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c137-staging
      - name: Apply exact Commit 137 diagnostic patch
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          p=Path('MediaPlayer.sv')
          t=p.read_text()

          a=t.index('// Commit 136 keeps the slow direct USER override')
          b=t.index('reg        mpeg2_new_b_diag_active;',a)
          comment='// Commit 137 keeps the proven slow direct USER override, but after B raster\n// stage 15 it reports exactly which ordinary top-level acceptance prerequisite\n// is still false for the controlled I/P/B stream. Counts 1..14 are failure\n// categories; 15 means every listed prerequisite is clean. Decode, DDR,\n// publication, and normal I/P USER behavior are unchanged.\n'
          t=t[:a]+comment+t[b:]

          a=t.index('wire mpeg2_new_b_core_error =')
          b=t.index('always @(posedge clk_mpeg2) begin',a)
          block='// The controlled B stream is coded I / future-P / B, so the ordinary P-success\n// branch is the relevant pre-B acceptance path. Each number identifies the\n// first remaining false prerequisite; 15 is the all-clean sentinel.\nwire [3:0] mpeg2_new_b_completion_diag_target =\n    !mpeg2_new_p_macroblock_type_seen                         ? 4\'d1 :\n    !mpeg2_new_first_picture_420_parsed                       ? 4\'d2 :\n    !mpeg2_new_second_picture_420_parsed                      ? 4\'d3 :\n    (mpeg2_new_picture_count < 8\'d2)                          ? 4\'d4 :\n    (mpeg2_new_completed_frame_bank != mpeg2_new_display_frame_bank) ? 4\'d5 :\n    !mpeg2_new_phase1t_reference_read_ok                      ? 4\'d6 :\n    !mpeg2_new_phase1t_implicit_reconstruct_ok                ? 4\'d7 :\n    !mpeg2_new_recon_macroblock_420_complete                  ? 4\'d8 :\n    !mpeg2_new_phase1n_frame_geometry_supported               ? 4\'d9 :\n    mpeg2_new_syntax_error                                    ? 4\'d10 :\n    (mpeg2_new_inverse_quant_error ||\n     mpeg2_new_inverse_quant_unsupported_matrix)              ? 4\'d11 :\n    (mpeg2_new_idct_error || mpeg2_new_recon_error)           ? 4\'d12 :\n    !mpeg2_new_ddr_write_seen                                 ? 4\'d13 :\n    (!mpeg2_new_ddr_cache_ready ||\n     !mpeg2_new_ddr_read_seen ||\n      mpeg2_new_ddr_cache_error)                              ? 4\'d14 :\n                                                                  4\'d15;\n\n'
          t=t[:a]+block+t[b:]
          p.write_text(t)
          PYCODE
      - name: Commit staged RTL
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MediaPlayer.sv
          git diff --cached --quiet && exit 0
          git commit -m 'stage Commit 137 RTL'
          git push origin HEAD:c137-staging
